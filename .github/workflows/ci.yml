name: CI/CD — Supervision 5G

on:
  push:
    branches: [ develop, main, 'feature/**' ]
  pull_request:
    branches: [ develop, main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:

  # ───────── BUILD BACKEND MICROSERVICES ─────────

  build-service:
    name: 🔨 Build Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [micro_user, micro_reclamation, micro_map, microservice-ia, eureka, gateway]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar

  # ───────── BUILD FRONTEND ─────────

  build-frontend:
    name: 🅰️ Build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration production

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ───────── DOCKER BUILD & PUSH ─────────

  docker-push:
    name: 🐳 Docker Push
    runs-on: ubuntu-latest
    needs: [build-service, build-frontend]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Download all jars
      - name: Download artifacts
        uses: actions/download-artifact@v4

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push services
      - name: Build & Push micro_user
        uses: docker/build-push-action@v5
        with:
          context: ./micro_user
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/micro-user:latest
            ${{ env.DOCKER_USERNAME }}/micro-user:${{ github.sha }}

      - name: Build & Push micro_reclamation
        uses: docker/build-push-action@v5
        with:
          context: ./micro_reclamation
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/micro-reclamation:latest
            ${{ env.DOCKER_USERNAME }}/micro-reclamation:${{ github.sha }}

      - name: Build & Push micro_map
        uses: docker/build-push-action@v5
        with:
          context: ./micro_map
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/micro-map:latest
            ${{ env.DOCKER_USERNAME }}/micro-map:${{ github.sha }}

      - name: Build & Push microservice_ia
        uses: docker/build-push-action@v5
        with:
          context: ./microservice-ia
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/microservice-ia:latest
            ${{ env.DOCKER_USERNAME }}/microservice-ia:${{ github.sha }}

      - name: Build & Push eureka
        uses: docker/build-push-action@v5
        with:
          context: ./eureka
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/eureka:latest
            ${{ env.DOCKER_USERNAME }}/eureka:${{ github.sha }}

      - name: Build & Push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/gateway:latest
            ${{ env.DOCKER_USERNAME }}/gateway:${{ github.sha }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/supervision-frontend:latest
            ${{ env.DOCKER_USERNAME }}/supervision-frontend:${{ github.sha }}

  # ───────── SUMMARY ─────────

  pipeline-summary:
    name: ✅ Pipeline Summary
    runs-on: ubuntu-latest
    needs: docker-push
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Pipeline CI/CD — Supervision 5G" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| micro_user | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| micro_reclamation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| micro_map | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| microservice_ia | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| eureka | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| gateway | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend Angular | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Push | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY