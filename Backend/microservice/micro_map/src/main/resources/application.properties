spring.application.name=micro_map

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/telecom
spring.datasource.username=khaled
spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=klodezdinfaute@gmail.com
spring.mail.password=dcch nide bxsh ibos
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=8081
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=affectation-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.admin.auto-create=true

# Logs
logging.level.com.example.micro_map=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=ERROR
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{30} - %msg%n
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR